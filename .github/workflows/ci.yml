# Compila e roda os testes a cada pull request (e sob demanda). Não publica nada: o deploy do piloto
# continua sendo o do Render, a partir do main (ver render.yaml).
#
# O último passo grava o fim do log num check-run ("Relatório do build"), legível pela API do GitHub
# (GET /repos/{dono}/{repo}/commits/{sha}/check-runs) — é por ali que um agente sem acesso ao Maven
# Central acompanha o resultado.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: divinaluz_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Testes
        id: testes
        run: |
          set -o pipefail
          ./mvnw -B -ntp verify 2>&1 | tee build.log
      - name: Relatório do build
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusao=$([ "${{ steps.testes.outcome }}" = "success" ] && echo success || echo failure)
          { grep -E "Tests run:|ERROR|FAIL|BUILD|expected|but was|Exception" build.log | grep -v "^\[INFO\] Download" | tail -n 400; } > resumo.txt || true
          python3 - "$conclusao" <<'PY'
          import json, sys
          texto = open("resumo.txt", encoding="utf-8", errors="replace").read()[-60000:]
          json.dump({"name": "Relatório do build", "head_sha": "${{ github.event.pull_request.head.sha || github.sha }}",
                     "status": "completed", "conclusion": sys.argv[1],
                     "output": {"title": "mvn verify: " + sys.argv[1], "summary": "Fim do log do Maven.", "text": texto}},
                    open("relatorio.json", "w"))
          PY
          gh api repos/${{ github.repository }}/check-runs --input relatorio.json > /dev/null
