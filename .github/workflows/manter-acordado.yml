# Mantém o piloto acordado das 19:00 às 23:00 (horário de Brasília), todos os dias (2026-10-12).
#
# O plano gratuito do Render põe o sistema para dormir depois de 15 minutos sem uso, e quem chega
# primeiro espera cerca de um minuto. Nesta janela ele é chamado a cada 5 minutos no /actuator/health,
# que é público e só responde {"status":"UP"}. Fora dela, volta a hibernar normalmente.
#
# O endereço vem da variável do repositório APP_URL (Settings → Secrets and variables → Actions →
# Variables), sem barra no fim — ex.: https://divinaluz-xxxx.onrender.com.
#
# Cuidados:
# - O cron do GitHub é em UTC: Brasília é UTC-3 (sem horário de verão desde 2019).
#   18:42 BRT = 21:42 UTC (acorda antes das 19h); 19:02–22:57 BRT = 22:02–01:57 UTC.
# - O GitHub pode atrasar execuções agendadas em horários de pico; por isso a cada 5 minutos, com
#   folga sobre os 15 da hibernação, e fora da hora cheia.
# - Em repositório público, o GitHub desliga agendamentos depois de 60 dias sem nenhum commit. Se
#   o repositório ficar parado tanto tempo, reative em Actions → "Manter acordado" → Enable workflow.
name: Manter acordado

on:
  schedule:
    - cron: "42,47,52,57 21 * * *"
    - cron: "2-59/5 22,23,0,1 * * *"
  workflow_dispatch:

jobs:
  despertar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chama o /actuator/health
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Defina a variável APP_URL do repositório com o endereço do sistema."
            exit 1
          fi
          # Acordando, o Render leva cerca de um minuto: até 5 tentativas com 20 s entre elas.
          curl --fail --silent --show-error --max-time 90 \
               --retry 5 --retry-delay 20 --retry-all-errors \
               "$APP_URL/actuator/health"
          echo
