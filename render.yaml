# Blueprint do Render para o sistema da casa na nuvem (ver DEPLOY-NUVEM.md).
# O banco fica no Neon (PostgreSQL gratuito). As variáveis com sync: false são pedidas pelo painel do
# Render na criação e nunca ficam no repositório:
#   DATABASE_URL           a connection string do Neon, colada inteira (postgresql://...)
#   APP_BASE_URL           o endereço público do serviço, sem barra no fim
#   ADMIN_SENHA_REDEFINIR  a senha do admin, só no primeiro deploy — depois apague a variável
# O e-mail de definição de senha é opcional: sem as variáveis MAIL_*, o sistema segue funcionando com
# a recepção digitando a senha no cadastro (ver DEPLOY-NUVEM.md, "E-mail").
services:
  - type: web
    name: divinaluz
    runtime: docker
    plan: free
    branch: main
    healthCheckPath: /login
    envVars:
      # NÃO troque estes nomes pelos valores. "key" é o NOME da variável; "sync: false" quer dizer
      # exatamente "o valor é digitado no painel do Render, nunca aqui". Colar a connection string no
      # lugar de DATABASE_URL faz duas coisas ruins de uma vez: o Render recusa o blueprint (um nome de
      # variável não pode conter ":", "/", "@", "?" nem "&") e a senha do banco vai para o histórico do
      # git. Aconteceu em 2026-10-02 e custou a troca da senha do Neon.
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: ADMIN_SENHA_REDEFINIR
        sync: false
