# Blueprint do Render para a versão de demonstração (ver DEPLOY-DEMO.md).
# O banco fica no Neon (PostgreSQL gratuito sem prazo). As variáveis com sync: false são pedidas
# pelo painel do Render na criação e nunca ficam no repositório:
#   DATABASE_URL      a connection string do Neon, colada inteira (postgresql://...)
#   DEMO_ADMIN_SENHA  a senha do login "admin" na demo
services:
  - type: web
    name: divinaluz-demo
    runtime: docker
    plan: free
    branch: claude/retomar-divinaluz-5i25l0
    healthCheckPath: /login
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      - key: DATABASE_URL
        sync: false
      - key: DEMO_ADMIN_SENHA
        sync: false
