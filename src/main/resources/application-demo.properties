# Perfil "demo": versão de demonstração na nuvem gratuita (ver DEPLOY-DEMO.md).
# Banco e senhas chegam por variáveis de ambiente, nunca pelo repositório:
#   SPRING_DATASOURCE_URL       jdbc:postgresql://<host>/<banco>?sslmode=require
#   SPRING_DATASOURCE_USERNAME  / SPRING_DATASOURCE_PASSWORD
#   DEMO_ADMIN_SENHA            senha do login "admin" (obrigatória)
# A porta vem de PORT (definida pela plataforma) — ver server.port em application.properties.

# Sem prefixo /divinaluz: o link da demo abre direto na tela de login.
server.servlet.context-path=

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Plano gratuito do banco limita conexões; a demo não precisa de mais que isso.
spring.datasource.hikari.maximum-pool-size=4

# Cadastra assistidos, trabalhadores, escala e sessões fictícios na primeira subida.
divinaluz.demo.admin-senha=${DEMO_ADMIN_SENHA:}
