# Perfil "prod": o sistema rodando na nuvem, com dados reais da casa (ver DEPLOY-NUVEM.md).
# Nada de senha, endereço ou credencial neste arquivo — tudo chega por variável de ambiente:
#   DATABASE_URL           banco, colado inteiro do provedor: postgresql://usuario:senha@host/banco?sslmode=require
#                          (convertido para JDBC por DatabaseUrlConfig; SPRING_DATASOURCE_* também funciona)
#   APP_BASE_URL           endereço público, sem barra no fim: https://seu-endereco.onrender.com
#   ADMIN_SENHA_REDEFINIR  só no primeiro deploy, para trocar a senha do admin; depois apague a variável
#   MAIL_*                 opcionais, para o e-mail de definição de senha sair de verdade (ver abaixo)
# A porta vem de PORT (definida pela plataforma) — ver server.port em application.properties.

# Sem prefixo /divinaluz: o endereço da casa abre direto na tela de login.
server.servlet.context-path=

# Em produção o log não repete cada SQL — além de poluir, um SELECT com parâmetros expõe dado de
# assistido no log da plataforma, que não é lugar de dado pessoal.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Atrás do proxy do Render a aplicação recebe HTTP; o esquema e o host públicos vêm nos cabeçalhos
# X-Forwarded-*. Sem isto, as URLs montadas a partir do pedido — as que vão DENTRO dos QR codes
# (cartão e sessão) — sairiam como http:// e custariam um redirecionamento a cada leitura no celular.
server.forward-headers-strategy=framework

# Criar só o que cada tela usa encurta pela metade a subida depois da hibernação do plano gratuito.
spring.main.lazy-initialization=true

# O plano gratuito do banco limita conexões; a casa não precisa de mais que isso.
spring.datasource.hikari.maximum-pool-size=4

# O link de definição de senha precisa apontar para o endereço público, não para o localhost.
app.base-url=${APP_BASE_URL:}

# Troca a senha do admin na subida (ver SenhaAdminInicial). Em branco, não mexe em nada.
app.admin.senha-redefinir=${ADMIN_SENHA_REDEFINIR:}

# E-mail: com MAIL_HABILITADO=true e as credenciais SMTP, o assistido cadastrado com e-mail recebe o
# link para criar a própria senha. Sem isso o link só vai para o log e a recepção digita a senha no
# cadastro, que é o fluxo de quem não tem e-mail — o sistema funciona dos dois jeitos.
app.mail.habilitado=${MAIL_HABILITADO:false}
