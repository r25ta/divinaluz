spring.application.name=divinaluz
# Configurações do Servidor Web
server.port=${PORT:8081}
server.servlet.context-path=/divinaluz
spring.datasource.url=jdbc:postgresql://localhost:5432/divinaluz_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:admin}
spring.jpa.hibernate.ddl-auto=validate

# Todas as datas são apresentadas e digitadas no formato dd/MM/yyyy (Brasil), nunca ISO.
spring.mvc.format.date=dd/MM/yyyy

# Flyway: baseline permite adotar um banco que ja tinha tabelas criadas pelo ddl-auto=update
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# E-mail de definição de senha (ver EmailService/AcessoService). Sem credenciais configuradas,
# app.mail.habilitado fica false e o link é só logado no console em vez de enviado de verdade —
# configure as variáveis de ambiente abaixo (ex.: Gmail com senha de app) para envio real.
app.mail.habilitado=${MAIL_HABILITADO:false}
app.mail.remetente=${MAIL_REMETENTE:naeidivinaluz@example.com}
app.base-url=${APP_BASE_URL:http://localhost:8081/divinaluz}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true