spring.application.name=divinaluz
# Configurações do Servidor Web
server.port=${PORT:8081}
server.servlet.context-path=/divinaluz
spring.datasource.url=jdbc:postgresql://localhost:5432/divinaluz_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:admin}
spring.jpa.hibernate.ddl-auto=validate

# Desempenho no celular (2026-10-05): páginas compactadas (o HTML do painel e da listagem encolhe ~5x)
# e CSS/JS com cache de 1 ano. O cache longo só é seguro porque o nome do arquivo muda junto com o
# conteúdo (content strategy: o Thymeleaf escreve @{/css/app.css} como /css/app-<hash>.css), então
# um deploy com CSS novo nunca é servido velho do cache do aparelho.
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**,/js/**
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true

# Todas as datas são apresentadas e digitadas no formato dd/MM/yyyy (Brasil), nunca ISO.
spring.mvc.format.date=dd/MM/yyyy

# Flyway: baseline permite adotar um banco que ja tinha tabelas criadas pelo ddl-auto=update
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# E-mail de definição de senha (ver EmailService/AcessoService). Sem credenciais configuradas,
# app.mail.habilitado fica false e o link é só logado no console em vez de enviado de verdade —
# configure as variáveis de ambiente abaixo (ex.: Gmail com senha de app) para envio real.
app.mail.habilitado=${MAIL_HABILITADO:false}
app.mail.remetente=${MAIL_REMETENTE:naeidivinaluz@example.com}
app.base-url=${APP_BASE_URL:http://localhost:8081/divinaluz}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# O health indicator de mail do Actuator acompanha a mesma chave do envio: com o e-mail desligado
# (o padrão), spring.mail.host fica vazio e ele tentaria conectar em ":587", deixando
# /actuator/health em DOWN/503 para sempre, embora banco, disco e aplicação estejam de pé. Ligar o
# envio liga também a conferência.
management.health.mail.enabled=${MAIL_HABILITADO:false}