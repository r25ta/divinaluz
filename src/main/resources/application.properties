spring.application.name=divinaluz
# Configurações do Servidor Web
server.port=8081
server.servlet.context-path=/divinaluz
spring.datasource.url=jdbc:postgresql://localhost:5432/divinaluz_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:admin}
spring.jpa.hibernate.ddl-auto=validate

# Flyway: baseline permite adotar um banco que ja tinha tabelas criadas pelo ddl-auto=update
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true