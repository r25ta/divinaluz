<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Acesso ao Sistema')}"></head>
<body>
<div class="dl-app">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main class="dl-main">
        <div class="dl-container-narrow">

            <div class="dl-page-header">
                <div>
                    <span class="dl-eyebrow" th:text="${assistido.nome}">Assistido</span>
                    <h1>Acesso ao Sistema</h1>
                </div>
                <a th:href="@{/prontuario/{id}(id=${assistido.id})}" class="btn btn-outline-teal btn-sm">
                    <i class="bi bi-arrow-left"></i> Voltar ao Prontuário
                </a>
            </div>

            <div class="dl-card">
                <div class="dl-card-body">
                    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>
                    <p class="dl-muted">
                        Login de <strong th:text="${assistido.nome}"></strong> no sistema. O e-mail e o nome
                        são os do próprio cadastro do assistido.
                    </p>

                    <form th:action="@{/prontuario/{id}/acesso(id=${assistido.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <div class="mb-3">
                            <label class="form-label" for="login">Login</label>
                            <input id="login" name="login" class="form-control" maxlength="80" autocomplete="username"
                                   th:value="${assistido.login ?: assistido.email}" required>
                            <div class="form-text" th:if="${assistido.login == null and assistido.email != null}">
                                Sugerido a partir do e-mail do cadastro; pode ser alterado.
                            </div>
                        </div>
                        <div class="mb-3" th:if="${podeEscolherPerfil}">
                            <label class="form-label" for="perfil">Perfil de acesso</label>
                            <select id="perfil" name="perfil" class="form-select">
                                <option th:each="p : ${perfis}" th:value="${p.name()}" th:text="${p.name()}"
                                        th:selected="${assistido.perfilAcesso != null ? assistido.perfilAcesso == p : p.name() == 'ASSISTIDO'}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="senha"
                                   th:text="${assistido.login == null ? 'Senha' : 'Nova senha (deixe em branco para manter)'}">Senha</label>
                            <input id="senha" name="senha" type="password" class="form-control" minlength="6"
                                   autocomplete="new-password" th:required="${assistido.login == null}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="confirmacaoSenha">Confirmar senha</label>
                            <input id="confirmacaoSenha" name="confirmacaoSenha" type="password" class="form-control" minlength="6"
                                   autocomplete="new-password" th:required="${assistido.login == null}">
                        </div>
                        <div class="form-check mb-4" th:if="${assistido.login != null}">
                            <input class="form-check-input" type="checkbox" id="acessoAtivo" name="acessoAtivo" value="true"
                                   th:checked="${assistido.acessoAtivo}">
                            <label class="form-check-label" for="acessoAtivo">Acesso ativo</label>
                        </div>

                        <div class="d-flex justify-content-end gap-2 pt-2">
                            <a th:href="@{/prontuario/{id}(id=${assistido.id})}" class="btn btn-outline-teal">Cancelar</a>
                            <button type="submit" class="btn btn-teal text-white">
                                <i class="bi bi-person-check"></i> Salvar Acesso
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </main>
</div>
</body>
</html>
