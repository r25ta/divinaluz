<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Nova Avaliação')}"></head>
<body>
<div class="dl-app">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main class="dl-main">
        <div class="dl-container-narrow">

            <div class="dl-page-header">
                <div>
                    <span class="dl-eyebrow" th:text="${assistido.nome}">Assistido</span>
                    <h1>Registrar Avaliação</h1>
                </div>
                <a th:href="@{/prontuario/{id}(id=${assistido.id})}" class="btn btn-outline-teal btn-sm">
                    <i class="bi bi-arrow-left"></i> Voltar ao Prontuário
                </a>
            </div>

            <div class="dl-card">
                <div class="dl-card-body">

                    <form th:action="@{/prontuario/{id}/avaliacao(id=${assistido.id})}" th:object="${avaliacao}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <div class="dl-form-section">
                            <div class="dl-form-section-title">Avaliação</div>
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label class="form-label">Data da Avaliação</label>
                                    <input type="date" class="form-control" th:field="*{data}" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Evolução</label>
                                    <select class="form-select" th:field="*{evolucao}">
                                        <option value="">Selecione...</option>
                                        <option th:each="e : ${evolucoes}" th:value="${e}" th:text="${e}"></option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-text mt-2">A data da avaliação é livre — quem precisa cair no dia de assistência do assistido é a Entrevista, registrada depois.</div>
                        </div>

                        <div class="dl-form-section">
                            <div class="dl-form-section-title">Histórico</div>
                            <textarea class="form-control" th:field="*{historico}" rows="3" placeholder="Relato da avaliação..."></textarea>
                        </div>

                        <div class="dl-form-section">
                            <div class="dl-form-section-title">Observações</div>
                            <textarea class="form-control" th:field="*{observacoes}" rows="3" placeholder="Recomendações do médium para o assistido..."></textarea>
                        </div>

                        <div class="d-flex justify-content-end gap-2 pt-2">
                            <a th:href="@{/prontuario/{id}(id=${assistido.id})}" class="btn btn-outline-teal">Cancelar</a>
                            <button type="submit" class="btn btn-teal text-white">
                                <i class="bi bi-check-lg"></i> Salvar Avaliação
                            </button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </main>
</div>
</body>
</html>
