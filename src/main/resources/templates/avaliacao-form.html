<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Avaliação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Registrar Avaliação — <span th:text="${assistido.nome}"></span></h4>
        </div>
        <div class="card-body">

            <form th:action="@{/prontuario/{id}/avaliacao(id=${assistido.id})}" th:object="${avaliacao}" method="post">

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Data da Entrevista</label>
                        <input type="date" class="form-control" th:field="*{data}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Entrevistador</label>
                        <input type="text" class="form-control" th:field="*{entrevistador}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Evolução</label>
                        <select class="form-select" th:field="*{evolucao}">
                            <option value="">Selecione...</option>
                            <option th:each="e : ${evolucoes}" th:value="${e}" th:text="${e}"></option>
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-12">
                        <label class="form-label">Histórico</label>
                        <textarea class="form-control" th:field="*{historico}" rows="4"></textarea>
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Tratamento Indicado</label>
                        <select class="form-select" th:field="*{tratamentoIndicado}" required>
                            <option value="">Selecione...</option>
                            <option th:each="t : ${tratamentos}" th:value="${t.id}"
                                    th:text="${t.codigo + ' - ' + t.nome}"></option>
                        </select>
                        <div class="form-text">Pode repetir o tratamento anterior, se for o caso.</div>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/prontuario/{id}(id=${assistido.id})}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Salvar Avaliação</button>
                </div>
            </form>

        </div>
    </div>
</div>

</body>
</html>
