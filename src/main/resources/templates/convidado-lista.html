<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Preletores Convidados')}"></head>
<body>
<div class="dl-app">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <!--/* Lista dos preletores convidados (V41): eles ficam fora da listagem de prontuários, então
           é aqui que se edita e se desativa (ConvidadoController). */-->
    <main class="dl-main">
        <div class="dl-container" style="max-width: 960px;">
            <div class="dl-page-header">
                <div>
                    <span class="dl-eyebrow">Cadastro</span>
                    <h1>Preletores convidados</h1>
                </div>
                <div class="d-flex gap-2 flex-wrap">
                    <a th:href="@{/convidados/novo}" class="btn btn-teal btn-sm text-white">
                        <i class="bi bi-plus-lg"></i> Novo convidado
                    </a>
                    <a th:href="@{/prelecao}" class="btn btn-outline-teal btn-sm">
                        <i class="bi bi-calendar2-event"></i> Escala de preleções
                    </a>
                </div>
            </div>

            <div class="alert alert-success" th:if="${sucesso}">
                <i class="bi bi-check-circle-fill"></i> <span th:text="${sucesso}"></span>
            </div>

            <div class="dl-card">
                <div class="dl-card-body p-0">
                    <table class="dl-table" th:if="${not #lists.isEmpty(convidados)}">
                        <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Origem</th>
                            <th>Contato</th>
                            <th>Situação</th>
                            <th class="text-center">Ações</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="c : ${convidados}" th:classappend="${c.ativo} ? '' : 'linha-realizada'">
                            <td class="fw-semibold" th:text="${c.nome}">Nome</td>
                            <td th:text="${c.origem ?: '—'}">Origem</td>
                            <td>
                                <div th:if="${c.telefone}" th:text="${c.telefone}"></div>
                                <div class="dl-muted small" th:if="${c.email}" th:text="${c.email}"></div>
                                <span th:if="${c.telefone == null and c.email == null}">—</span>
                            </td>
                            <td>
                                <span class="dl-badge dl-badge-success" th:if="${c.ativo}">Ativo</span>
                                <span class="dl-badge dl-badge-neutral" th:unless="${c.ativo}">Desativado</span>
                            </td>
                            <td class="text-center">
                                <div class="d-flex justify-content-center gap-2">
                                    <a th:href="@{/convidados/{c}(c=${c.id})}" class="btn btn-outline-teal btn-sm" title="Editar">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <form th:action="@{/convidados/{c}/ativo(c=${c.id})}" method="post">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <button type="submit" class="btn btn-outline-secondary btn-sm"
                                                th:title="${c.ativo} ? 'Desativar (sai da lista de escolha da escala)' : 'Reativar'">
                                            <i class="bi" th:classappend="${c.ativo} ? 'bi-eye-slash' : 'bi-eye'"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <div class="dl-table-empty" th:if="${#lists.isEmpty(convidados)}">
                        <i class="bi bi-person-badge"></i>
                        <p class="mb-0">Nenhum preletor convidado cadastrado ainda.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
