<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Digite o código')}"></head>
<body>
<main class="dl-main d-flex align-items-center">
    <div class="dl-container-narrow" style="max-width: 430px; width: 100%;">
        <div class="text-center mb-4">
            <div class="dl-brand-mark mx-auto mb-3"><i class="bi bi-brightness-high-fill"></i></div>
            <span class="dl-eyebrow">Acesso sem senha</span>
            <h1 class="h3 fw-bold">N.A.E. Divina Luz</h1>
        </div>
        <div class="dl-card">
            <div class="dl-card-body">
                <div class="alert alert-info" th:if="${aviso}" th:text="${aviso}"></div>
                <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

                <!-- Quando o código morreu (expirou ou estourou tentativas) não há mais o que conferir:
                     a única saída é pedir outro, então a tela troca o formulário pelo caminho de volta. -->
                <div th:if="${pedirNovo}" class="text-center">
                    <a th:href="@{/entrar}" class="btn btn-teal text-white w-100">
                        <i class="bi bi-arrow-repeat"></i> Pedir um código novo
                    </a>
                </div>

                <form th:unless="${pedirNovo}" th:action="@{/entrar/codigo}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <p class="text-muted">
                        Abra o e-mail <strong th:text="${email}"></strong> e digite o código de 6 dígitos.
                        Ele vale por 15 minutos.
                    </p>
                    <div class="mb-3">
                        <label class="form-label" for="codigo">Código</label>
                        <!-- inputmode numeric abre o teclado de números no celular; one-time-code deixa o
                             sistema oferecer o preenchimento automático. Fonte grande porque a maior
                             parte de quem usa isto digita no celular, às vezes sem óculos. -->
                        <input id="codigo" name="codigo" class="form-control form-control-lg text-center"
                               style="font-size: 1.75rem; letter-spacing: .4rem;"
                               inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*"
                               maxlength="6" required autofocus>
                    </div>
                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" value="true"
                               id="remember-me" name="remember-me" checked>
                        <label class="form-check-label" for="remember-me">
                            Lembrar deste aparelho
                            <span class="d-block small text-muted">
                                Assim você não precisa pedir código a cada visita. Não marque em
                                computador compartilhado.
                            </span>
                        </label>
                    </div>
                    <button type="submit" class="btn btn-teal text-white w-100">
                        <i class="bi bi-box-arrow-in-right"></i> Entrar
                    </button>
                    <a th:href="@{/entrar}" class="btn btn-link w-100 mt-2">Usar outro e-mail</a>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
