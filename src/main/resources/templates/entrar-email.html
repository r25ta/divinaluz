<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Entrar com e-mail')}"></head>
<body>
<main class="dl-main d-flex align-items-center">
    <div class="dl-container-narrow" style="max-width: 430px; width: 100%;">
        <div class="text-center mb-4">
            <div class="dl-brand-mark mx-auto mb-3"><i class="bi bi-brightness-high-fill"></i></div>
            <span class="dl-eyebrow">Acesso sem senha</span>
            <h1 class="h3 fw-bold">N.A.E. Divina Luz</h1>
        </div>
        <div class="dl-card">
            <div class="dl-card-body">
                <p class="text-muted">
                    Informe o e-mail que você deu no cadastro. Enviamos um código de 6 dígitos para ele
                    — você não precisa de senha.
                </p>
                <form th:action="@{/entrar}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="mb-4">
                        <label class="form-label" for="email">Seu e-mail</label>
                        <input id="email" name="email" type="email" class="form-control form-control-lg"
                               autocomplete="email" inputmode="email" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-teal text-white w-100">
                        <i class="bi bi-envelope-paper"></i> Receber código
                    </button>
                </form>
                <hr class="my-4">
                <p class="small text-muted mb-0">
                    Não tem e-mail no cadastro? A recepção criou uma senha para você —
                    <a th:href="@{/login}">entre com login e senha</a>.
                </p>
            </div>
        </div>
    </div>
</main>
</body>
</html>
