<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <!--/* Fragmento de <head>: uso com th:replace="fragments/layout :: pageHead('Título da Página')" */-->
    <th:block th:fragment="pageHead(title)">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title th:text="${title} + ' · N.A.E. Divina Luz'">N.A.E. Divina Luz</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
        <link th:href="@{/css/app.css}" rel="stylesheet">
    </th:block>
</head>
<body>
    <!--/* Fragmento de navbar: uso com th:replace="fragments/layout :: navbar" */-->
    <nav class="dl-navbar" th:fragment="navbar">
        <div class="container-fluid d-flex align-items-center justify-content-between gap-3">
            <a th:href="@{/}" class="dl-brand">
                <span class="dl-brand-mark"><i class="bi bi-brightness-high-fill"></i></span>
                <span class="dl-brand-text">
                    <span class="dl-brand-title d-block">N.A.E. Divina Luz</span>
                    <span class="dl-brand-subtitle d-block">Assistência Espiritual</span>
                </span>
            </a>
            <div class="d-flex align-items-center gap-2">
                <a th:href="@{/prelecao}" class="btn btn-nav btn-sm">
                    <i class="bi bi-calendar2-event"></i> Preleções
                </a>
                <a th:href="@{/usuarios}" class="btn btn-nav btn-sm">
                    <i class="bi bi-people"></i> Usuários
                </a>
                <a th:href="@{/novo}" class="btn btn-nav btn-sm">
                    <i class="bi bi-plus-lg"></i> Novo Cadastro
                </a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-nav btn-sm" title="Sair">
                        <i class="bi bi-box-arrow-right"></i>
                    </button>
                </form>
            </div>
        </div>
    </nav>
</body>
</html>
