<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <!--/* Fragmento de <head>: uso com th:replace="fragments/layout :: pageHead('Título da Página')" */-->
    <th:block th:fragment="pageHead(title)">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title th:text="${title} + ' · N.A.E. Divina Luz'">N.A.E. Divina Luz</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
        <link th:href="@{/css/app.css}" rel="stylesheet">
        <script th:src="@{/js/data-mask.js}" defer></script>
        <!--/* Calendário e "ver senha" valem em todo o sistema, por isso ficam aqui e não por tela.
               O picker depende da máscara já ter sido aplicada, então vem depois dela. */-->
        <script th:src="@{/js/data-picker.js}" defer></script>
        <script th:src="@{/js/ver-senha.js}" defer></script>
        <!--/* Celular (2026-10-04): o menu recolhível e as tabelas que viram cartões em tela pequena. */-->
        <script th:src="@{/js/menu.js}" defer></script>
        <script th:src="@{/js/tabela-responsiva.js}" defer></script>
        <!--/* Toque duplo não grava duas vezes (2026-10-05). */-->
        <script th:src="@{/js/envio-unico.js}" defer></script>
    </th:block>
</head>
<body>
    <!--/* Fragmento de navbar: uso com th:replace="fragments/layout :: navbar" */-->
    <!--/* Menu (2026-10-04): no celular os itens se recolhem atrás do botão "☰" (menu.js) — antes
           eles ficavam numa linha só, alargavam a página inteira e cortavam todas as telas à direita.
           Sem o JS do Bootstrap de propósito: o projeto não carrega JavaScript de terceiros. */-->
    <nav class="dl-navbar" th:fragment="navbar">
        <div class="container-fluid dl-navbar-inner">
            <!--/* A marca leva à tela de entrada, que é o próprio cartão (todo login entra por ele). */-->
            <a th:href="${meuAssistidoId != null} ? @{/prontuario/{id}/cartao(id=${meuAssistidoId})} : @{/}" class="dl-brand">
                <span class="dl-brand-mark"><i class="bi bi-brightness-high-fill"></i></span>
                <span class="dl-brand-text">
                    <span class="dl-brand-title d-block">N.A.E. Divina Luz</span>
                    <span class="dl-brand-subtitle d-block">Assistência Espiritual</span>
                </span>
            </a>
            <button type="button" class="dl-nav-toggle" aria-controls="dlNavMenu" aria-expanded="false" aria-label="Abrir o menu">
                <i class="bi bi-list"></i>
            </button>
            <div class="dl-nav-menu" id="dlNavMenu">
                <!--/* Para todos (2026-10-04): o próprio cartão é a tela de entrada de quem loga, e o
                       trabalhador também é assistido e tem o seu. */-->
                <a th:if="${meuAssistidoId != null}" th:href="@{/prontuario/{id}/cartao(id=${meuAssistidoId})}" class="btn btn-nav btn-sm">
                    <i class="bi bi-card-checklist"></i> Meu Cartão
                </a>
                <!--/* Prontuário (2026-10-04): a listagem de assistidos — o caminho para os prontuários é este
                       item do menu (antes só se chegava clicando na marca do topo). Só com CONSULTA. */-->
                <a th:if="${podeConsulta}" th:href="@{/}" class="btn btn-nav btn-sm">
                    <i class="bi bi-folder2-open"></i> Prontuário
                </a>
                <a th:if="${podeSessao}" th:href="@{/sessao}" class="btn btn-nav btn-sm">
                    <i class="bi bi-speedometer2"></i> Sessão
                </a>
                <a th:if="${podeVerTratamentoProposto}" th:href="@{/entrevistas}" class="btn btn-nav btn-sm position-relative">
                    <i class="bi bi-chat-square-text"></i> Entrevistas
                    <span class="dl-nav-badge" th:if="${filaEntrevistas > 0}" th:text="${filaEntrevistas}"></span>
                </a>
                <a th:href="@{/prelecao}" class="btn btn-nav btn-sm">
                    <i class="bi bi-calendar2-event"></i> Preleções
                </a>
                <a th:if="${podeTrabalhadores}" th:href="@{/trabalhadores}" class="btn btn-nav btn-sm">
                    <i class="bi bi-people"></i> Trabalhadores
                </a>
                <a th:if="${podeCadastro}" th:href="@{/novo}" class="btn btn-nav btn-sm">
                    <i class="bi bi-plus-lg"></i> Novo Cadastro
                </a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-nav btn-sm" title="Sair">
                        <i class="bi bi-box-arrow-right"></i><span class="dl-nav-sair-texto"> Sair</span>
                    </button>
                </form>
            </div>
        </div>
    </nav>
</body>
</html>
