<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Assistidos')}"></head>
<body>
<div class="dl-app">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main class="dl-main">
        <div class="dl-container">

            <div class="dl-page-header">
                <div>
                    <span class="dl-eyebrow">Prontuários</span>
                    <h1>Assistidos</h1>
                </div>
                <div class="d-flex align-items-center gap-3 flex-wrap">
                    <a th:if="${not mostrarInativos}" th:href="@{/(mostrarInativos=true)}" class="dl-muted small">
                        <i class="bi bi-eye"></i> Mostrar inativos
                    </a>
                    <a th:if="${mostrarInativos}" th:href="@{/}" class="dl-muted small">
                        <i class="bi bi-eye-slash"></i> Mostrar somente ativos
                    </a>
                    <div class="dl-search">
                        <i class="bi bi-search"></i>
                        <input type="search" id="buscaAssistido" class="form-control" placeholder="Buscar por nome...">
                    </div>
                </div>
            </div>

            <div class="alert alert-success" th:if="${sucesso}">
                <i class="bi bi-check-circle-fill"></i> <span th:text="${sucesso}"></span>
            </div>
            <div class="alert alert-warning" th:if="${aviso}">
                <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${aviso}"></span>
            </div>

            <div class="dl-card">
                <div class="dl-card-body-flush">
                    <table class="dl-table" id="tabelaAssistidos" th:if="${not #lists.isEmpty(assistidos)}">
                        <thead>
                            <tr>
                                <th><button type="button" class="sort-button" data-sort="nome">Nome <i class="bi bi-arrow-down-up"></i></button></th>
                                <th><button type="button" class="sort-button" data-sort="vinculo">Vínculo <i class="bi bi-arrow-down-up"></i></button></th>
                                <th><button type="button" class="sort-button" data-sort="status">Status Atual <i class="bi bi-arrow-down-up"></i></button></th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="a : ${assistidos}" class="linha-assistido">
                                <td>
                                    <div class="d-flex align-items-center gap-2">
                                        <span class="fw-semibold nome-assistido" data-sort-value="nome" th:text="${a.nome}"></span>
                                        <span th:unless="${a.ativo}" class="dl-badge dl-badge-neutral">Inativo</span>
                                    </div>
                                    <div class="dl-muted small" th:if="${a.residencia}" th:text="${a.residencia}"></div>
                                </td>
                                <td>
                                    <span class="dl-badge dl-badge-neutral" data-sort-value="vinculo" th:text="${a.vinculo}"></span>
                                </td>
                                <td>
                                    <span class="dl-badge"
                                          th:classappend="${a.statusCartao != null ? a.statusCartao.badgeClasse : 'dl-badge-success'}"
                                          data-sort-value="status"
                                          th:text="${a.statusCartao != null ? a.statusCartao.label : 'Em Tratamento'}">
                                        Em Tratamento
                                    </span>
                                </td>
                                <td class="text-end">
                                    <a th:href="@{/prontuario/{id}/cartao(id=${a.id})}" class="btn btn-outline-teal btn-sm">
                                        <i class="bi bi-card-checklist"></i> Cartão
                                    </a>
                                    <a th:href="@{/prontuario/{id}(id=${a.id})}" class="btn btn-outline-teal btn-sm">
                                        Ver Prontuário <i class="bi bi-arrow-right"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>

                    <div class="dl-table-empty" th:if="${#lists.isEmpty(assistidos)}">
                        <i class="bi bi-people"></i>
                        <p class="mb-2">Nenhum assistido cadastrado ainda.</p>
                        <a th:href="@{/novo}" class="btn btn-teal btn-sm text-white">
                            <i class="bi bi-plus-lg"></i> Cadastrar o primeiro
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </main>
</div>

<script th:inline="javascript">
    (function () {
        var tabela = document.getElementById('tabelaAssistidos');
        var busca = document.getElementById('buscaAssistido');
        if (!tabela) return;

        var corpo = tabela.querySelector('tbody');
        var linhas = Array.from(corpo.querySelectorAll('.linha-assistido'));
        var ordenacao = { campo: null, ascendente: true };

        function atualizarBusca() {
            var termo = busca ? busca.value.trim().toLowerCase() : '';
            linhas.forEach(function (linha) {
                var nome = linha.querySelector('.nome-assistido').textContent.toLowerCase();
                linha.style.display = nome.includes(termo) ? '' : 'none';
            });
        }

        function ordenar(campo, botao) {
            ordenacao.ascendente = ordenacao.campo === campo ? !ordenacao.ascendente : true;
            ordenacao.campo = campo;
            linhas.sort(function (a, b) {
                var valorA = a.querySelector('[data-sort-value="' + campo + '"]').textContent.trim();
                var valorB = b.querySelector('[data-sort-value="' + campo + '"]').textContent.trim();
                return valorA.localeCompare(valorB, 'pt-BR', { sensitivity: 'base' })
                    * (ordenacao.ascendente ? 1 : -1);
            });
            linhas.forEach(function (linha) { corpo.appendChild(linha); });
            document.querySelectorAll('.sort-button').forEach(function (elemento) {
                elemento.classList.remove('active');
                elemento.querySelector('i').className = 'bi bi-arrow-down-up';
            });
            botao.classList.add('active');
            botao.querySelector('i').className = ordenacao.ascendente ? 'bi bi-arrow-up' : 'bi bi-arrow-down';
            atualizarBusca();
        }

        if (busca) busca.addEventListener('input', atualizarBusca);
        document.querySelectorAll('.sort-button').forEach(function (botao) {
            botao.addEventListener('click', function () { ordenar(botao.dataset.sort, botao); });
        });
    })();
</script>
</body>
</html>
