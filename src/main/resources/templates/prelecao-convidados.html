<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Preletores Convidados')}"></head>
<body>
<div class="dl-app">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <!--/* Preletores convidados (V40): fazem preleção na casa, mas não são assistidos — sem cartão,
           prontuário ou acesso. Mesma permissão da escala (PRELECAO). Ver PrelecaoController. */-->
    <main class="dl-main">
        <div class="dl-container" style="max-width: 960px;">
            <div class="dl-page-header">
                <div>
                    <span class="dl-eyebrow">Escala</span>
                    <h1>Preletores convidados</h1>
                </div>
                <a th:href="@{/prelecao}" class="btn btn-outline-teal btn-sm">
                    <i class="bi bi-arrow-left"></i> Escala de preleções
                </a>
            </div>

            <div class="alert alert-success" th:if="${sucesso}">
                <i class="bi bi-check-circle-fill"></i> <span th:text="${sucesso}"></span>
            </div>
            <div class="alert alert-danger" th:if="${erro}">
                <i class="bi bi-exclamation-octagon-fill"></i> <span th:text="${erro}"></span>
            </div>

            <div class="dl-card">
                <div class="dl-card-header">
                    <div class="dl-card-header-title">
                        <span class="dl-card-icon"><i class="bi bi-person-plus"></i></span>
                        <h2 th:text="${convidado.id != null} ? 'Editar convidado' : 'Novo convidado'">Novo convidado</h2>
                    </div>
                </div>
                <div class="dl-card-body">
                    <form th:action="${convidado.id != null} ? @{/prelecao/convidados/{c}(c=${convidado.id})} : @{/prelecao/convidados}"
                          method="post" th:object="${convidado}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label" for="nome">Nome</label>
                                <input id="nome" class="form-control" th:field="*{nome}" maxlength="150" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="origem">Casa espírita / instituição <span class="dl-muted">(opcional)</span></label>
                                <input id="origem" class="form-control" th:field="*{origem}" maxlength="150">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="telefone">Telefone <span class="dl-muted">(opcional)</span></label>
                                <input id="telefone" class="form-control" th:field="*{telefone}" maxlength="30" inputmode="tel">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="email">E-mail <span class="dl-muted">(opcional)</span></label>
                                <input id="email" type="email" class="form-control" th:field="*{email}" maxlength="150">
                            </div>
                            <div class="col-12">
                                <label class="form-label" for="observacoes">Observações <span class="dl-muted">(opcional)</span></label>
                                <textarea id="observacoes" class="form-control" rows="2" th:field="*{observacoes}"></textarea>
                            </div>
                        </div>
                        <div class="d-flex justify-content-end gap-2 mt-3">
                            <a th:if="${convidado.id != null}" th:href="@{/prelecao/convidados}" class="btn btn-outline-teal">Cancelar edição</a>
                            <button type="submit" class="btn btn-teal text-white">
                                <i class="bi bi-check-lg"></i> Salvar convidado
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="dl-card">
                <div class="dl-card-body p-0">
                    <table class="dl-table" th:if="${not #lists.isEmpty(convidados)}">
                        <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Origem</th>
                            <th>Contato</th>
                            <th>Situação</th>
                            <th class="text-center">Ações</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="c : ${convidados}" th:classappend="${c.ativo} ? '' : 'linha-realizada'">
                            <td class="fw-semibold" th:text="${c.nome}">Nome</td>
                            <td th:text="${c.origem ?: '—'}">Origem</td>
                            <td>
                                <div th:if="${c.telefone}" th:text="${c.telefone}"></div>
                                <div class="dl-muted small" th:if="${c.email}" th:text="${c.email}"></div>
                                <span th:if="${c.telefone == null and c.email == null}">—</span>
                            </td>
                            <td>
                                <span class="dl-badge dl-badge-success" th:if="${c.ativo}">Ativo</span>
                                <span class="dl-badge dl-badge-neutral" th:unless="${c.ativo}">Desativado</span>
                            </td>
                            <td class="text-center">
                                <div class="d-flex justify-content-center gap-2">
                                    <a th:href="@{/prelecao/convidados/{c}(c=${c.id})}" class="btn btn-outline-teal btn-sm" title="Editar">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <form th:action="@{/prelecao/convidados/{c}/ativo(c=${c.id})}" method="post">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <button type="submit" class="btn btn-outline-secondary btn-sm"
                                                th:title="${c.ativo} ? 'Desativar (sai da lista de escolha da escala)' : 'Reativar'">
                                            <i class="bi" th:classappend="${c.ativo} ? 'bi-eye-slash' : 'bi-eye'"></i>
                                        </button>
                                    </form>
                                    <form th:action="@{/prelecao/convidados/{c}/excluir(c=${c.id})}" method="post"
                                          onsubmit="return confirm('Excluir este convidado? Só é possível se ele nunca esteve na escala.');">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <button type="submit" class="btn btn-outline-danger btn-sm" title="Excluir">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <div class="dl-table-empty" th:if="${#lists.isEmpty(convidados)}">
                        <i class="bi bi-person-badge"></i>
                        <p class="mb-0">Nenhum preletor convidado cadastrado ainda.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
