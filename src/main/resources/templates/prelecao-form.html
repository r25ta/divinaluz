<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead(${prelecao.id != null ? 'Editar Preleção' : 'Nova Preleção'})}"></head>
<body>
<div class="dl-app">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main class="dl-main">
        <div class="dl-container" style="max-width: 760px;">
            <div class="dl-page-header">
                <div>
                    <span class="dl-eyebrow">Escala</span>
                    <h1 th:text="${prelecao.id != null ? 'Editar Preleção' : 'Nova Preleção'}">Nova Preleção</h1>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <a th:href="@{/prelecao}" class="btn btn-outline-teal btn-sm">
                        <i class="bi bi-arrow-left"></i> Voltar
                    </a>
                </div>
            </div>

            <div class="alert alert-danger" th:if="${erro}">
                <i class="bi bi-exclamation-octagon-fill"></i> <span th:text="${erro}"></span>
            </div>
            <div class="alert alert-warning" th:if="${prelecao.cancelada}">
                <i class="bi bi-x-octagon-fill"></i> Esta preleção está <strong>cancelada</strong>
                <span th:if="${prelecao.motivoCancelamento}" th:text="'(' + ${prelecao.motivoCancelamento} + ')'"></span>.
                Para ela voltar a valer, use <strong>Reativar</strong> na escala.
            </div>

            <div class="dl-card">
                <div class="dl-card-body">
                    <form th:action="${prelecao.id != null} ? @{/prelecao/{id}/editar(id=${prelecao.id})} : @{/prelecao/salvar}" method="post" th:object="${prelecao}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label" for="dataApresentacao">Data da apresentação</label>
                                <input id="dataApresentacao" type="text" class="form-control dl-data" th:field="*{dataApresentacao}" required
                                       placeholder="dd/mm/aaaa" maxlength="10" inputmode="numeric" data-dias="0,2"
                                       pattern="\d{2}/\d{2}/\d{4}" title="Formato: dd/mm/aaaa">
                                <div class="form-text">Aceita somente terça-feira ou domingo.</div>
                            </div>

                            <!--/* Trabalhador da casa (T:id) ou convidado (C:id) no mesmo campo; NOVO
                                   cadastra o convidado aqui mesmo (PrelecaoController.aplicarPreletor). O
                                   nome do campo não é "preletor" de propósito — ver o javadoc do controller. */-->
                            <div class="col-md-6">
                                <label class="form-label" for="preletorEscolhido">Preletor</label>
                                <select id="preletorEscolhido" class="form-select" name="preletorEscolhido" required>
                                    <option value="">Selecione...</option>
                                    <optgroup label="Trabalhadores da casa">
                                        <option th:each="p : ${preletores}"
                                                th:value="'T:' + ${p.id}"
                                                th:text="${p.assistido.nome}"
                                                th:selected="${preletorEscolhido == 'T:' + p.id}"></option>
                                    </optgroup>
                                    <optgroup label="Convidados">
                                        <option th:each="c : ${convidados}"
                                                th:value="'C:' + ${c.id}"
                                                th:text="${c.nome} + (${c.origem != null} ? ' — ' + ${c.origem} : '') + (${c.ativo} ? '' : ' (desativado)')"
                                                th:selected="${preletorEscolhido == 'C:' + c.id}"></option>
                                        <option value="NOVO" th:selected="${preletorEscolhido == 'NOVO'}">+ Cadastrar convidado novo...</option>
                                    </optgroup>
                                </select>
                                <div class="form-text">
                                    Convidado é quem vem de fora e não é assistido da casa.
                                    <a th:href="@{/prelecao/convidados}">Gerenciar convidados</a>
                                </div>
                            </div>

                            <div class="col-12" id="blocoNovoConvidado" th:classappend="${preletorEscolhido == 'NOVO'} ? '' : 'd-none'">
                                <div class="border rounded p-3">
                                    <div class="fw-semibold mb-2"><i class="bi bi-person-plus"></i> Preletor convidado</div>
                                    <div class="row g-2">
                                        <div class="col-md-6">
                                            <label class="form-label small" for="novoConvidadoNome">Nome</label>
                                            <input id="novoConvidadoNome" name="novoConvidadoNome" class="form-control"
                                                   maxlength="150" th:value="${novoConvidado.nome}">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label small" for="novoConvidadoTelefone">Telefone (opcional)</label>
                                            <input id="novoConvidadoTelefone" name="novoConvidadoTelefone" class="form-control"
                                                   maxlength="30" inputmode="tel" th:value="${novoConvidado.telefone}">
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label small" for="novoConvidadoOrigem">Casa espírita / instituição (opcional)</label>
                                            <input id="novoConvidadoOrigem" name="novoConvidadoOrigem" class="form-control"
                                                   maxlength="150" th:value="${novoConvidado.origem}">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="col-12">
                                <label class="form-label" for="tema">Tema / Título da preleção</label>
                                <input id="tema" type="text" class="form-control" th:field="*{tema}" placeholder="Ex.: Evangelho no Lar" required>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a th:href="@{/prelecao}" class="btn btn-outline-teal">Cancelar</a>
                            <button type="submit" class="btn btn-teal text-white">
                                <i class="bi bi-check-lg"></i>
                                <span th:text="${prelecao.id != null ? 'Salvar Alterações' : 'Salvar Preleção'}">Salvar</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>
<script>
    // Mostra os campos do convidado novo só quando "Cadastrar convidado novo" está escolhido, e só
    // então o nome passa a ser obrigatório no navegador (o servidor confere de novo).
    (function () {
        var select = document.getElementById('preletorEscolhido');
        var bloco = document.getElementById('blocoNovoConvidado');
        var nome = document.getElementById('novoConvidadoNome');
        function ajustar() {
            var novo = select.value === 'NOVO';
            bloco.classList.toggle('d-none', !novo);
            nome.required = novo;
            if (novo && !nome.value) nome.focus();
        }
        select.addEventListener('change', ajustar);
        ajustar();
    })();
</script>
</body>
</html>
