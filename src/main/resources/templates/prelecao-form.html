<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead(${prelecao.id != null ? 'Editar Preleção' : 'Nova Preleção'})}"></head>
<body>
<div class="dl-app">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main class="dl-main">
        <div class="dl-container" style="max-width: 760px;">
            <div class="dl-page-header">
                <div>
                    <span class="dl-eyebrow">Escala</span>
                    <h1 th:text="${prelecao.id != null ? 'Editar Preleção' : 'Nova Preleção'}">Nova Preleção</h1>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <a th:href="@{/prelecao}" class="btn btn-outline-teal btn-sm">
                        <i class="bi bi-arrow-left"></i> Voltar
                    </a>
                </div>
            </div>

            <div class="alert alert-danger" th:if="${erro}">
                <i class="bi bi-exclamation-octagon-fill"></i> <span th:text="${erro}"></span>
            </div>
            <div class="alert alert-warning" th:if="${prelecao.cancelada}">
                <i class="bi bi-x-octagon-fill"></i> Esta preleção está <strong>cancelada</strong>
                <span th:if="${prelecao.motivoCancelamento}" th:text="'(' + ${prelecao.motivoCancelamento} + ')'"></span>.
                Para ela voltar a valer, use <strong>Reativar</strong> na escala.
            </div>

            <div class="dl-card">
                <div class="dl-card-body">
                    <form th:action="${prelecao.id != null} ? @{/prelecao/{id}/editar(id=${prelecao.id})} : @{/prelecao/salvar}" method="post" th:object="${prelecao}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label" for="dataApresentacao">Data da apresentação</label>
                                <input id="dataApresentacao" type="text" class="form-control dl-data" th:field="*{dataApresentacao}" required
                                       placeholder="dd/mm/aaaa" maxlength="10" inputmode="numeric" data-dias="0,2"
                                       pattern="\d{2}/\d{2}/\d{4}" title="Formato: dd/mm/aaaa">
                                <div class="form-text">Aceita somente terça-feira ou domingo.</div>
                            </div>

                            <!--/* Trabalhador da casa (T:id) ou convidado (C:id) no mesmo campo. O convidado é
                                   cadastrado no Novo Cadastro (V41). O nome do campo não é "preletor" de
                                   propósito — ver o javadoc do PrelecaoController. */-->
                            <div class="col-md-6">
                                <label class="form-label" for="preletorEscolhido">Preletor</label>
                                <select id="preletorEscolhido" class="form-select" name="preletorEscolhido" required>
                                    <option value="">Selecione...</option>
                                    <optgroup label="Trabalhadores da casa">
                                        <option th:each="p : ${preletores}"
                                                th:value="'T:' + ${p.id}"
                                                th:text="${p.assistido.nome}"
                                                th:selected="${preletorEscolhido == 'T:' + p.id}"></option>
                                    </optgroup>
                                    <optgroup label="Convidados" th:if="${!convidados.isEmpty()}">
                                        <option th:each="c : ${convidados}"
                                                th:value="'C:' + ${c.id}"
                                                th:text="${c.nome} + (${c.origem != null} ? ' — ' + ${c.origem} : '') + (${c.ativo} ? '' : ' (desativado)')"
                                                th:selected="${preletorEscolhido == 'C:' + c.id}"></option>
                                    </optgroup>
                                </select>
                                <div class="form-text">
                                    Convidado é quem vem de fora e não é assistido da casa.
                                    <a th:if="${podeCadastro}" th:href="@{/convidados/novo}">Cadastrar convidado</a>
                                    <span th:unless="${podeCadastro}">Para cadastrar um, peça à recepção (Novo Cadastro).</span>
                                </div>
                            </div>

                            <div class="col-12">
                                <label class="form-label" for="tema">Tema / Título da preleção</label>
                                <input id="tema" type="text" class="form-control" th:field="*{tema}" placeholder="Ex.: Evangelho no Lar" required>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a th:href="@{/prelecao}" class="btn btn-outline-teal">Cancelar</a>
                            <button type="submit" class="btn btn-teal text-white">
                                <i class="bi bi-check-lg"></i>
                                <span th:text="${prelecao.id != null ? 'Salvar Alterações' : 'Salvar Preleção'}">Salvar</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
