<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Nova Sessão')}"></head>
<body>
<div class="dl-app">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main class="dl-main">
        <div class="dl-container-narrow">

            <div class="dl-page-header">
                <div>
                    <span class="dl-eyebrow" th:text="${assistido.nome}">Assistido</span>
                    <h1>Registrar Nova Sessão</h1>
                </div>
                <a th:href="@{/prontuario/{id}(id=${assistido.id})}" class="btn btn-outline-teal btn-sm">
                    <i class="bi bi-arrow-left"></i> Voltar ao Prontuário
                </a>
            </div>

            <div class="alert alert-danger" th:if="${erro}">
                <p class="mb-2" th:text="${erro}"></p>
                <a th:if="${avaliacaoPendente}" th:href="@{/prontuario/{id}/nova-avaliacao(id=${assistido.id})}"
                   class="btn btn-warning btn-sm">
                    <i class="bi bi-clipboard2-pulse"></i> Registrar Avaliação
                </a>
            </div>

            <div class="dl-card">
                <div class="dl-card-body">

                    <form th:action="@{/prontuario/{id}/sessao(id=${assistido.id})}" th:object="${sessao}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <div class="dl-form-section">
                            <div class="dl-form-section-title">Data</div>
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label class="form-label">Data da Consulta</label>
                                    <!--/* Mesma regra da entrevista: a presença cai no dia de assistência da
                                           pessoa; sem dia definido, nada é exigido e o calendário fica livre. */-->
                                    <input type="text" class="form-control dl-data" th:field="*{dataConsulta}" required
                                           placeholder="dd/mm/aaaa" maxlength="10" inputmode="numeric"
                                           th:attr="data-dias=${assistido.diaFrequencia != null ? assistido.diaFrequencia.indiceJs : null}"
                                           pattern="\d{2}/\d{2}/\d{4}" title="Formato: dd/mm/aaaa">
                                </div>
                            </div>
                        </div>

                        <div class="dl-form-section">
                            <div class="dl-form-section-title">Recomendações</div>
                            <div class="dl-chip-group">
                                <input class="dl-chip-check" type="checkbox" id="rec-visto" th:field="*{visto}">
                                <label class="dl-chip-label" for="rec-visto"><span class="dl-chip-dot"></span> Visto</label>

                                <input class="dl-chip-check" type="checkbox" id="rec-assistencia" th:field="*{assistencia}">
                                <label class="dl-chip-label" for="rec-assistencia"><span class="dl-chip-dot"></span> Assistência</label>

                                <input class="dl-chip-check" type="checkbox" id="rec-evangelho" th:field="*{evangelhoNoLar}">
                                <label class="dl-chip-label" for="rec-evangelho"><span class="dl-chip-dot"></span> Evangelho no Lar</label>

                                <input class="dl-chip-check" type="checkbox" id="rec-leituras" th:field="*{leituras}">
                                <label class="dl-chip-label" for="rec-leituras"><span class="dl-chip-dot"></span> Leituras</label>

                                <input class="dl-chip-check" type="checkbox" id="rec-escola" th:field="*{escola}">
                                <label class="dl-chip-label" for="rec-escola"><span class="dl-chip-dot"></span> Escola</label>

                                <input class="dl-chip-check" type="checkbox" id="rec-trabalho" th:field="*{trabalhoEspiritual}">
                                <label class="dl-chip-label" for="rec-trabalho"><span class="dl-chip-dot"></span> Trabalho Espiritual</label>

                                <input class="dl-chip-check" type="checkbox" id="rec-medico" th:field="*{medico}">
                                <label class="dl-chip-label" for="rec-medico"><span class="dl-chip-dot"></span> Médico</label>
                            </div>
                        </div>

                        <div class="dl-form-section">
                            <div class="dl-form-section-title">Observações</div>
                            <textarea class="form-control" th:field="*{observacoes}" rows="3" placeholder="Notas sobre a sessão..."></textarea>
                        </div>

                        <div class="d-flex justify-content-end gap-2 pt-2">
                            <a th:href="@{/prontuario/{id}(id=${assistido.id})}" class="btn btn-outline-teal">Cancelar</a>
                            <!-- Cartão expirado (21 dias): só a recepção confirma o reinício em P2. -->
                            <button type="submit" class="btn btn-warning" th:if="${cartaoExpirado}"
                                    th:formaction="@{/prontuario/{id}/sessao(id=${assistido.id},reiniciarP2=true)}">
                                <i class="bi bi-arrow-repeat"></i> Reiniciar em P2 e registrar
                            </button>
                            <button type="submit" class="btn btn-teal text-white">
                                <i class="bi bi-check-lg"></i> Salvar Sessão
                            </button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </main>
</div>
</body>
</html>
