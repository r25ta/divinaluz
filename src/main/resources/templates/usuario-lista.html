<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Acessos')}" ></head>
<body>
<div class="dl-app">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <main class="dl-main">
        <div class="dl-container">
            <div class="dl-page-header">
                <div>
                    <span class="dl-eyebrow">Administração</span>
                    <h1>Acessos ao Sistema</h1>
                </div>
                <a th:href="@{/}" class="btn btn-outline-teal btn-sm">
                    <i class="bi bi-people"></i> Assistidos
                </a>
            </div>

            <div class="alert alert-info small">
                O acesso pertence ao cadastro do assistido: para criar ou alterar login, perfil e senha,
                abra o prontuário e use "Acesso ao Sistema".
            </div>
            <div class="alert alert-success" th:if="${sucesso}" th:text="${sucesso}"></div>
            <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

            <div class="dl-card">
                <div class="dl-card-body-flush">
                    <div class="table-responsive">
                        <table class="dl-table" th:if="${not #lists.isEmpty(usuarios)}">
                            <thead>
                            <tr>
                                <th>Login</th>
                                <th>Nome</th>
                                <th>E-mail</th>
                                <th>Perfil</th>
                                <th>Status</th>
                                <th class="text-end">Ações</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="a : ${usuarios}">
                                <td class="fw-semibold" th:text="${a.login}"></td>
                                <td th:text="${a.nome}"></td>
                                <td th:text="${a.email ?: '—'}"></td>
                                <td><span class="dl-badge dl-badge-info" th:text="${a.perfilAcesso}"></span></td>
                                <td>
                                    <span th:if="${a.acessoAtivo}" class="dl-badge dl-badge-success">Ativo</span>
                                    <span th:unless="${a.acessoAtivo}" class="dl-badge dl-badge-neutral">Inativo</span>
                                </td>
                                <td class="text-end">
                                    <div class="d-flex justify-content-end gap-2 flex-wrap">
                                        <a th:href="@{/prontuario/{id}/acesso(id=${a.id})}" class="btn btn-outline-teal btn-sm" title="Editar acesso">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <form th:action="@{/usuarios/{id}/alternar(id=${a.id})}" method="post" class="d-inline">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                            <button type="submit" class="btn btn-outline-teal btn-sm" th:title="${a.acessoAtivo ? 'Desativar acesso' : 'Ativar acesso'}">
                                                <i th:class="${a.acessoAtivo ? 'bi bi-person-slash' : 'bi bi-person-check'}"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="dl-table-empty" th:if="${#lists.isEmpty(usuarios)}">
                        <i class="bi bi-people"></i>
                        <p class="mb-0">Nenhum acesso cadastrado.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
